[package]
name = "gtuim"
version = "0.4.1"
edition = "2021"
description = "Native GPUI desktop workspace and IDE powered by Neovim — GUI rebuild of Rtuim using Zed's GPUI framework"
license = "GPL-3.0-or-later"
repository = "https://github.com/Tuim-editor/Gtuim"

[[bin]]
name = "gtuim"
path = "src/main.rs"

[lib]
name = "gtuim"
path = "src/lib.rs"

[dependencies]
gpui = "=0.2.2"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
rmpv = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "=0.2.186"
unicode-width = "0.2"
portable-pty = "0.9"
vt100 = "0.16"
pulldown-cmark = { version = "0.13", default-features = false }

[dev-dependencies]
gpui = { version = "=0.2.2", features = ["test-support"] }

[profile.dev]
opt-level = 1
debug = 0

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
