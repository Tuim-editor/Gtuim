name: Build shareable executables

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake pkg-config libasound2-dev libfontconfig1-dev libfreetype6-dev libwayland-dev libx11-xcb-dev libxcb1-dev libxkbcommon-x11-dev libvulkan-dev libssl-dev
      - name: Select Xcode and Metal tools
        if: runner.os == 'macOS'
        run: |
          xcrun --find clang
          xcrun --find metal
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Report tests
        # Avoid optimizing the entire GPUI dependency graph just for headless tests.
        run: cargo test --locked --lib bug_report --config 'profile.test.opt-level=0' --config 'profile.test.package."*".opt-level=0' -- --test-threads=1
      - name: Build native executable
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Smoke test and package
        run: bash scripts/package-release.sh '${{ matrix.target }}'
      - uses: actions/upload-artifact@v4
        with:
          name: gtuim-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
